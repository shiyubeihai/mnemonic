<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mnemonic · 记忆宫殿</title>
<meta name="description" content="把要记的东西放进熟悉的房间，按路线走一遍取回来。">
<style>
  :root{
    --paper:#F3F6F8; --ink:#26282B; --accent:#2E6CA6; --orange:#D2762E;
    --line:rgba(38,40,43,.1); --dim:#8B8378;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Songti SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:44px 20px 40px}
  header{text-align:center;margin-bottom:30px}
  h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.14em}
  .sub{margin:8px 0 0;font-size:14.5px;color:#6E675D}
  .ver{display:inline-block;margin-top:12px;font-size:11.5px;color:var(--accent);
       border:1px solid rgba(46,108,166,.3);border-radius:999px;padding:2px 10px;letter-spacing:.06em}

  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:640px){ .grid{grid-template-columns:1fr 1fr} }

  .card{
    display:block;position:relative;overflow:hidden;text-decoration:none;color:inherit;
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(38,40,43,.08);border-color:rgba(46,108,166,.45)}
  a.card:active{transform:translateY(0)}
  .card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
  .kicker{display:block;font-size:11.5px;letter-spacing:.1em;color:var(--c,var(--accent));margin-bottom:6px}
  .card h2{margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:.02em}
  .card p{margin:0;font-size:14px;color:#6E675D;line-height:1.7}
  .meta{display:block;margin-top:12px;font-size:12px;color:#A9A194;font-variant-numeric:tabular-nums}

  .card.ghost{background:transparent;border-style:dashed;color:#6E675D}
  .card.ghost:before{display:none}
  .card.ghost h2{font-size:17px;color:#8B8378}

  footer{
    margin-top:34px;text-align:center;font-size:12.5px;color:#A9A194;
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center;
  }
  footer a{color:var(--accent);text-decoration:none;border-bottom:1px dashed rgba(46,108,166,.35)}
  footer a:hover{border-bottom-style:solid}
  .dot{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MNEMONIC</h1>
    <p class="sub">把要记的东西，放进你熟悉的房间</p>
    <span class="ver">1.0</span>
  </header>

  <main class="grid">
    <a class="card" href="palace/index.html#home" style="--c:#D2762E">
      <span class="kicker">记忆宫殿 · 家</span>
      <h2>发展心理学</h2>
      <p>从门厅走到阳台，七个房间装 47 条 312 核心要点。</p>
      <span class="meta">7 间房 · 47 处 · 四套配色</span>
    </a>

    <div class="card ghost">
      <span class="kicker">待加</span>
      <h2>下一个地点</h2>
      <p>学校、超市、地铁线。在框架里加一个地点，把这里补上一张卡。</p>
    </div>
  </main>

  <footer>
    <a href="https://mbd.pub/o/bread/mbd-YZaWlZxxbQ==">给我买杯柠檬水</a>
    <span class="dot">·</span>
    <span>单文件 · 无依赖 · 离线可用</span>
  </footer>
</div>
</body>
</html>
