<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>记忆宫殿 · 框架 1.0</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#F3F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记忆宫殿">
<style>
  :root{
    --paper:#F3F6F8; --ink:#26282B; --deep:#2E6CA6; --deep-soft:#E3EDF6;
    --line:rgba(38,40,43,.12); --bad:#B5483C; --gold:#C99A2E; --dim:#8B8378;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Songti SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:540px;margin:0 auto;padding:24px 18px 44px}
  header{text-align:center;margin-bottom:18px}
  h1{margin:0 0 4px;font-size:21px;font-weight:600;letter-spacing:.1em}
  .sub{margin:0;font-size:13px;color:var(--dim);min-height:20px}

  .card{background:#fff;border:1px solid rgba(38,40,43,.09);border-radius:14px;padding:16px 18px}
  .intro p{margin:0 0 8px;font-size:14.5px}
  .intro p:last-child{margin:0}
  .dim{color:var(--dim)}

  .palace{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    margin-bottom:8px;cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s,box-shadow .15s;
  }
  .palace:hover{border-color:var(--deep)}
  .palace:active{background:#F7F4EC}
  .palace .p-main{flex:1;min-width:0}
  .palace .p-name{display:block;font-size:17px;font-weight:600}
  .palace .p-desc{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
  .palace .p-prog{font-size:12px;color:#A9A194;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
  .palace .p-prog i{display:block;font-style:normal;font-size:11px;margin-top:2px;color:var(--deep)}

  .room{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    margin-bottom:8px;cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s;
  }
  .room:hover{border-color:var(--deep)}
  .room:active{background:#F7F4EC}
  .room .bar-r{width:4px;align-self:stretch;border-radius:3px;background:var(--deep);opacity:.85}
  .room .r-main{flex:1;min-width:0}
  .room .r-name{display:block;font-size:16px;font-weight:600;line-height:1.4}
  .room .r-sub{display:block;font-size:12.5px;color:var(--dim);margin-top:1px;line-height:1.4}
  .room .r-prog{font-size:12px;color:#A9A194;white-space:nowrap;font-variant-numeric:tabular-nums}

  .back{
    display:inline-block;background:none;border:0;padding:0;margin:0 0 12px;
    font:inherit;font-size:13px;color:var(--deep);cursor:pointer;
  }

  .bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--dim);margin-bottom:10px}
  .bar .left{display:flex;align-items:center;gap:6px;min-width:0}
  .bar .bar-back{background:none;border:0;padding:0;font:inherit;font-size:15px;line-height:1;color:var(--deep);cursor:pointer}
  .bar .acts{display:flex;gap:6px}
  .bar .hint-btn{
    background:none;border:1px dashed rgba(38,40,43,.28);border-radius:999px;
    padding:2px 10px;font:inherit;font-size:12px;color:var(--deep);cursor:pointer;
  }

  .loc-card{
    background:#fff;border:1px solid rgba(38,40,43,.09);border-left:4px solid var(--deep);
    border-radius:4px 14px 14px 4px;padding:12px 16px;margin-bottom:14px;
  }
  .loc-room{font-size:12.5px;letter-spacing:.06em}
  .loc-spot{font-size:22px;font-weight:600;margin-top:2px}
  .q{font-size:14px;color:#6E675D;margin-top:8px}
  .loc-cue{
    margin-top:12px;font-size:13.5px;line-height:1.6;color:#5F5A52;
    background:rgba(38,40,43,.045);border-radius:0 8px 8px 0;border-left:3px solid rgba(38,40,43,.12);
    padding:8px 10px;
  }
  .loc-cue b{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--deep);margin-bottom:2px}

  .item-no{
    display:inline-block;font-size:12px;color:var(--deep);background:var(--deep-soft);
    border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums;letter-spacing:.04em;
  }
  .tag{font-size:11px;color:#fff;background:var(--bad);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  .item-title{font-size:19px;font-weight:600;margin:8px 0 10px;line-height:1.4}
  .pts{list-style:none;margin:0;padding:0}
  .pts li{position:relative;padding-left:14px;margin-bottom:7px;font-size:14.5px;line-height:1.7}
  .pts li:before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:rgba(38,40,43,.25)}
  .pts b{color:var(--deep);font-weight:600}
  .pts li:last-child{margin-bottom:0}
  .item-block + .item-block{margin-top:18px;padding-top:16px;border-top:1px dashed rgba(38,40,43,.12)}

  .note-label{display:block;font-size:12.5px;color:var(--dim);margin:16px 0 6px}
  .note{
    width:100%;border:1px solid rgba(38,40,43,.14);border-radius:10px;padding:11px 13px;
    font:inherit;font-size:14.5px;background:#fff;color:inherit;outline:none;
  }
  .note:focus{border-color:var(--deep)}

  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--deep);color:#fff;margin-top:14px}
  .btn.primary:active{filter:brightness(.92)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);margin-top:10px}

  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .tools .btn{margin-top:0;padding:10px 4px;font-size:13.5px;border-radius:10px}

  .rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
  .rate button{
    border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;
    font:inherit;font-size:14.5px;cursor:pointer;color:inherit;
  }
  .rate button:hover{background:#F7F4EC}
  .rate .r0{border-color:rgba(181,72,60,.35);color:var(--bad)}
  .rate .r1{border-color:rgba(201,154,46,.4);color:#A87F1E}
  .rate .r2{border-color:rgba(38,40,43,.18);color:var(--deep)}

  .score{text-align:center;margin:8px 0 18px}
  .score-num{font-size:40px;font-weight:600;color:var(--deep);line-height:1.1;font-variant-numeric:tabular-nums}
  .score-label{font-size:14px;color:#6E675D;margin-top:4px}
  .breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 20px;text-align:center}
  .breakdown>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px}
  .breakdown .n{font-size:22px;font-weight:600}
  .breakdown .l{font-size:12px;color:var(--dim)}
  .breakdown .b0 .n{color:var(--bad)}
  .breakdown .b1 .n{color:#A87F1E}
  .breakdown .b2 .n{color:var(--deep)}

  .palettes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .palette{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 4px 7px;
    cursor:pointer;font-family:inherit;color:inherit;
  }
  .palette:hover{border-color:var(--deep)}
  .palette.on{border-color:var(--deep);box-shadow:0 0 0 2px var(--deep-soft)}
  .palette .sw{display:flex;justify-content:center;gap:3px;margin-bottom:5px}
  .palette .sw i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08)}
  .palette .pn{font-size:11px;color:#6E675D}
  .pal-lab{font-size:12px;color:var(--dim);margin:0 0 8px;letter-spacing:.06em}

  .progress-all{height:6px;border-radius:3px;background:rgba(38,40,43,.08);overflow:hidden;margin:14px 0 6px}
  .progress-all i{display:block;height:100%;background:var(--deep);border-radius:3px}
  .tip{font-size:12px;color:#A9A194;text-align:center;margin:14px 0 0}
  .flash{font-size:12.5px;color:var(--deep);text-align:center;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appName">记忆宫殿</h1>
    <p class="sub" id="sub">框架 1.0</p>
  </header>
  <main id="app"></main>
</div>

<script>
(function(){
'use strict';

/* =========================================================================
   记忆宫殿 · 框架 1.0
   -------------------------------------------------------------------------
   结构：地点 PALACE → 房间 ROOM → 陈设 SPOT → 条目 ITEM
   加内容只改下面的「内容区」，逻辑与样式不用动：

   ① 加条目：在 ITEMS 里加一条
        '教01': { no:'教01', title:'名称', tag:'', pts:['要点一','要点二'] }
        pts 里可以用 <b>…</b> 标关键词。

   ② 加地点：在 PALACES 里加一个对象
        { id:'school', name:'学校', desc:'一句话说明',
          rooms:[ { id:'gate', name:'校门', sub:'小标题',
                    spots:[ { s:'石碑', ids:['教01'] } ] } ] }

   ③ 加房间：往 rooms 数组里加一个对象即可，颜色自动按顺序取。

   ④ 一个陈设放多条：ids:['教01','教02']，卡片会并排显示，一起评级。

   ⑤ 条号全局唯一。跨学科用前缀区分：发 / 教 / 统 / 测。
   ========================================================================= */

var APP = {
  title: '记忆宫殿',
  sub: '框架 1.0',
  key: 'palace.frame.v1',
  themeKey: 'palace.frame.theme.v1'
};

/* ========================= 内容区 ========================= */
var ITEMS = {
  '发01': { no:'发01', title:'毕生发展观（巴尔特斯）', pts:[
    '五特点：<b>毕生性、多向性、可塑性、历史情境性、多学科性</b>',
    '核心命题：发展是<b>获得与丧失的动态平衡</b>，任何年龄都有可塑性',
    '钩：毕·多·可·历·多'
  ]},
  '发02': { no:'发02', title:'SOC 模型', pts:[
    '<b>选择（S）—优化（O）—补偿（C）</b>',
    '资源下降时：收缩目标、优化投入、用替代手段补偿'
  ]},
  '发03': { no:'发03', title:'发展的一般规律', pts:[
    '<b>顺序性</b>：头尾律（由上到下）、近远律（中心到外周）、由粗到细',
    '<b>连续性与阶段性统一</b>（量变与质变的统一）',
    '<b>不平衡性</b>：关键期 / 敏感期、发展加速期',
    '个别差异；<b>年龄特征</b>既有稳定性又有可变性'
  ]},
  '发04': { no:'发04', title:'遗传与环境之争', pts:[
    '高尔顿：遗传决定论；华生：环境决定论（「给我一打儿童」）',
    '格塞尔：<b>成熟势力说</b>（双生子爬梯）→ 斯卡尔「遗传限」',
    '现代主流：<b>相互作用论</b>；基因型—环境相关三型：<b>被动型、唤起型、主动型</b>'
  ]},
  '发05': { no:'发05', title:'关键期 / 敏感期', pts:[
    '来源：洛伦兹<b>印刻</b>；语言关键期（伦内伯格）；依恋关键期',
    '现多用<b>敏感期</b>：错过有补偿空间，非「过时不可逆」'
  ]},
  '发06': { no:'发06', title:'研究方法', pts:[
    '<b>横断</b>：快、省，受<b>同辈效应</b>干扰',
    '<b>纵向</b>：能看个体变化，慢，有练习效应与样本流失',
    '<b>聚合交叉</b>：二者结合，最理想'
  ]},
  '发07': { no:'发07', title:'皮亚杰的机制', pts:[
    '<b>图式</b>',
    '<b>同化</b>（量变，纳入原有图式）',
    '<b>顺应</b>（质变，改造图式）',
    '<b>平衡化</b>（内在动力）'
  ]},
  '发08': { no:'发08', title:'皮亚杰四阶段', tag:'最高频', pts:[
    '感知运动 0–2：<b>客体永久性</b>（8–12 月）、循环反应三级、<b>A 非 B 错误</b>、延迟模仿',
    '前运算 2–7：符号 / 表象功能、<b>自我中心</b>（三山实验）、泛灵论、<b>不守恒</b>、中心化、不可逆、集体独白',
    '具体运算 7–11：<b>守恒</b>、去中心化、可逆性、分类、序列化、传递性；仍离不开具体事物',
    '形式运算 11+：<b>假设演绎推理</b>、命题运算、抽象与系统性、理想主义'
  ]},
  '发09': { no:'发09', title:'皮亚杰的评价', pts:[
    '低估儿童能力（现代研究显示成就提前）；阶段跨文化一致性存疑',
    '忽视社会文化、教育与语言的作用；低估<b>领域特殊性</b>'
  ]},
  '发10': { no:'发10', title:'维果茨基', pts:[
    '高级心理机能<b>社会起源</b>；<b>心理工具（符号）中介</b>；<b>内化</b>',
    '<b>最近发展区（ZPD）</b>：现有水平与潜在水平之间的差距',
    '<b>教学应走在发展前面</b>；引申出<b>支架式教学</b>（布鲁纳）'
  ]},
  '发11': { no:'发11', title:'自我中心言语之争', tag:'对比必考', pts:[
    '皮亚杰：认知不成熟的产物，最终<b>消失</b>',
    '维果茨基：社会言语<b>内化</b>的过渡，最终转为<b>内部言语</b>'
  ]},
  '发12': { no:'发12', title:'皮亚杰 vs 维果茨基', tag:'对比必考', pts:[
    '来源：<b>个体建构 vs 社会建构</b>',
    '机制：<b>平衡化 vs 内化</b>',
    '教育：<b>不宜超前教 vs 教学走在发展前面</b>',
    '语言与思维：<b>思维决定语言 vs 语言塑造思维</b>'
  ]},
  '发13': { no:'发13', title:'信息加工观', pts:[
    '关注<b>加工速度、工作记忆容量、策略、元认知</b>',
    '主张发展是<b>连续的量的变化</b>，反对阶段质变',
    '代表：<b>重叠波理论</b>（西格勒）、资源有限说（凯斯）'
  ]},
  '发14': { no:'发14', title:'生态系统理论（布朗芬布伦纳）', pts:[
    '<b>微系统 → 中间系统 → 外层系统 → 宏观系统 → 时间系统</b>'
  ]},
  '发15': { no:'发15', title:'埃里克森八阶段', tag:'必默写', pts:[
    '信任—不信任（0–1.5）｜自主—羞怯（1.5–3）｜主动—内疚（3–6）｜勤奋—自卑（6–12）',
    '同一性—角色混乱（12–18）｜亲密—孤独（18–35）｜繁殖—停滞（35–60）｜自我整合—绝望（60+）',
    '钩：信·自·主·勤｜同·亲·繁·整'
  ]},
  '发16': { no:'发16', title:'语言发展理论', pts:[
    '<b>强化说</b>（斯金纳）',
    '<b>先天论 / LAD</b>（乔姆斯基）',
    '<b>交互作用论</b>（先天＋环境，主流）'
  ]},
  '发17': { no:'发17', title:'心理理论（ToM）', pts:[
    '<b>错误信念任务</b>约 4 岁通过；愿望—信念推理',
    '<b>自闭症</b>儿童 ToM 缺陷'
  ]},
  '发18': { no:'发18', title:'道德发展三理论', pts:[
    '皮亚杰：<b>他律道德</b>（重结果）→ <b>自律道德</b>（重动机），10–11 岁转折',
    '科尔伯格：三水平六阶段——前习俗（惩罚服从、朴素利己）→ 习俗（好孩子、维护秩序）→ 后习俗（社会契约、普遍伦理）',
    '吉利根：<b>关怀伦理</b>；特里尔：<b>社会领域理论</b>（道德 / 社会习俗 / 个人事务）'
  ]},
  '发19': { no:'发19', title:'婴儿动作发展规律', pts:[
    '<b>头尾</b>（由上到下）、<b>近远</b>（中心到外周）、整体到分化、无意到有意、粗到细'
  ]},
  '发20': { no:'发20', title:'婴儿感知觉', pts:[
    '<b>优先发展</b>；<b>视觉悬崖</b>（吉布森，6 个月有深度知觉）；面部偏好；偏好母亲声音',
    '结论：<b>知觉发展早于动作发展</b>'
  ]},
  '发21': { no:'发21', title:'婴儿记忆', pts:[
    '<b>再认先于回忆</b>；<b>延迟模仿</b>（9 个月起）；<b>婴儿期记忆缺失</b>'
  ]},
  '发22': { no:'发22', title:'气质类型（托马斯—切斯）', pts:[
    '<b>容易型</b>约 40%、<b>困难型</b>约 10%、<b>迟缓型</b>约 15%，其余为混合型',
    '气质是依恋与人格发展的基础；<b>拟合优度</b>：养育方式与气质匹配才有利'
  ]},
  '发23': { no:'发23', title:'依恋四阶段（鲍尔比）', pts:[
    '无差别反应（0–3 月）→ 有差别反应（3–6 月）→ <b>特殊情感联结</b>（6 月–2 岁，陌生人焦虑与分离焦虑高峰）→ <b>互惠关系</b>（2 岁后）'
  ]},
  '发24': { no:'发24', title:'陌生情境与依恋四类型（安斯沃斯）', tag:'必考', pts:[
    '<b>安全型</b>约 65%：以母亲为安全基地，分离焦虑，重聚易被安抚',
    '<b>回避型</b>约 20%：对母亲在场离开均淡漠，重聚无反应',
    '<b>反抗 / 矛盾型</b>约 10%：黏母，重聚既求接触又抗拒',
    '<b>组织混乱型</b>约 5%：行为矛盾无组织，多见于受虐儿童',
    '影响因素：<b>养育敏感性</b>、婴儿气质、家庭环境；形成<b>内部工作模型</b>'
  ]},
  '发25': { no:'发25', title:'哈洛恒河猴', pts:[
    '<b>接触安慰 &gt; 喂食</b>；依恋不是「喂食的副产品」'
  ]},
  '发26': { no:'发26', title:'情绪与自我里程碑', pts:[
    '<b>社会性微笑</b> 2–3 月；<b>陌生人焦虑</b> 6–8 月；<b>分离焦虑</b> 8 月—1.5~2 岁高峰',
    '<b>点红实验</b>（阿姆斯特丹）：18–24 月出现镜像自我'
  ]},

  ] },
  '测303': { no:'测303', title:"CTT（经典测验理论）的真分数模型是什么？", tag:'', pts:[
      "<b>X＝T＋E</b>（观测分数＝真分数＋误差分数）；方差形式 <b>S<sub>X</sub>²＝S<sub>T</sub>²＋S<sub>E</sub>²</b>。真分数是无数次测量的期望值，不是\"真实能力\"。",
      "<u>易错：真分数可望不可即，只能说\"某次观测在真分数附近波动\"。</u>"
  ] },
  '测304': { no:'测304', title:"CTT 的三条假设是什么？", tag:'', pts:[
      "<b>①误差的期望为 0（E(E)＝0，随机误差正负抵消）；②真分数与误差相互独立；③不同测量的误差之间相互独立</b>。三条假设共同保证了\"观测分数的变异可分解为真变异＋误差变异\"。"
  ] },
  '测305': { no:'测305', title:"信度的定义式是什么？如何理解它？", tag:'', pts:[
      "<b>r<sub>xx</sub>＝S<sub>T</sub>²／S<sub>X</sub>²＝1−S<sub>E</sub>²／S<sub>X</sub>²</b>，即<b>真分数方差占观测分数方差的比例</b>。信度不是\"两次测量的一致程度\"这种笼统说法，而是<b>方差比</b>。",
      "<u>易错：信度是测验分数（群体）的属性，不是某个个体的属性。</u>"
  ] },
  '测306': { no:'测306', title:"随机误差与系统误差对信度、效度的影响有何不同？", tag:'', pts:[
      "<b>随机误差使分数不稳定 → 降低信度，也降低效度</b>；<b>系统误差使分数稳定地偏一个方向 → 不影响信度，但降低效度</b>。",
      "<u>易错：这是全章最高频的一处辨析。例：量表刻度整体偏移 5 分，信度不变、效度下降。</u>"
  ] },
  '测307': { no:'测307', title:"信度的五种估计方法各反映什么？", tag:'', pts:[
      "<b>重测＝稳定性（跨时间）·复本＝等值性（跨版本）·分半＝内部一致性（半个测验）·同质信度（α、KR-20）＝内部一致性·评分者＝评分者间一致性</b>。选择依据是\"你想证明哪一类误差不重要\"。"
  ] },
  '测308': { no:'测308', title:"重测信度的时间间隔为什么通常取 2–4 周？", tag:'', pts:[
      "<b>间隔太短：被试记得上次答案，信度被记忆抬高（虚高）；间隔太长：被试本身发生变化（成熟、学习、经历），信度被真实变化压低</b>。",
      "<u>易错：报告重测信度必须注明间隔时间，否则数值无法解释。</u>"
  ] },
  '测310': { no:'测310', title:"分半信度为什么要做斯皮尔曼—布朗校正？", tag:'', pts:[
      "因为分半后求得的 r<sub>hh</sub> 只是<b>半个测验的信度</b>，而信度随题目数增加而提高。<b>校正的作用是把\"半长测验\"的信度推算回全长</b>，校正后数值必然高于原始 r<sub>hh</sub>。",
      "<u>易错：直接报 0.55 而不校正，会系统性低估信度。</u>"
  ] },
  '测311': { no:'测311', title:"斯皮尔曼—布朗校正公式与预言公式分别是什么？", tag:'', pts:[
      "校正到全长：<b>r<sub>xx</sub>＝2r<sub>hh</sub>／(1＋r<sub>hh</sub>)</b>；预言题量变化后的信度：<b>r<sub>n</sub>＝n·r／[1＋(n−1)r]</b>。",
      "<u>易错：两式都叫斯—布朗，考场要看问的是\"校正半长\"还是\"预测长度变化\"。</u>"
  ] },
  '测314': { no:'测314', title:"α 系数偏低是否说明测验不同质？", tag:'', pts:[
      "<b>不能这样推</b>。α 是<b>内部一致性的下限</b>，受题目异质、难度分布、样本同质性等多因素影响；<b>α 低可能是题目异质，也可能是样本过于同质</b>。",
      "<u>易错：反方向也不成立——α 很高不等于测验单维（题目高度重复也能得出高 α）。</u>"
  ] },
  '测316': { no:'测316', title:"为什么同一测验用于不同团体时信度会不同？", tag:'', pts:[
      "因为信度是<b>方差比</b>，<b>团体越异质（分数分布越宽），真分数方差越大，信度越高</b>；用于高度同质的团体（如全部是重点班学生）时信度会明显下降。",
      "<u>易错：报告信度必须说明样本团体；\"这个测验信度 0.9\"是不完整的说法。</u>"
  ] },
  '测318': { no:'测318', title:"速度测验为什么不宜用分半信度和 α 系数？", tag:'', pts:[
      "因为速度测验的题目<b>并非平行</b>：得分差异主要来自\"做了多少题\"而非\"每题答对概率\"。分半后两半的题目在位置上不等值，<b>内部一致性系数会严重低估信度</b>。此类测验宜用<b>重测信度或复本信度</b>。",
      "<u>易错：这是\"信度方法选择\"的经典陷阱题。</u>"
  ] },
  '测319': { no:'测319', title:"测量标准误的公式是什么？它衡量什么？", tag:'', pts:[
      "<b>SE＝S<sub>X</sub>√(1−r<sub>xx</sub>)</b>，用观测分数的标准差 S<sub>X</sub> 与信度计算。它衡量<b>个体分数的波动范围</b>，用于对单个分数作区间解释。",
      "<u>易错：SE 越小说明分数越可靠；公式里用的是 S<sub>X</sub> 而不是 S<sub>T</sub>。</u>"
  ] },
  '测321': { no:'测321', title:"信度与效度是什么关系？", tag:'', pts:[
      "<b>信度是效度的必要非充分条件：效度 ≤ √信度</b>。信度低时效度必然低；<b>信度高时效度不一定高</b>（可能稳定地测错了东西）。",
      "<u>易错：关系是\"效度≤√信度\"，不是\"效度≤信度\"；信度 0.81 时效度最高 0.90。</u>"
  ] },
  '测324': { no:'测324', title:"CTT 的主要局限是什么？", tag:'', pts:[
      "<b>①假设所有题目平行（难度、区分度、误差方差相同），现实中难满足；②信度、标准误被假定为对所有被试相同，忽略个体差异；③测验分数依赖特定样本（样本依赖）；④题目参数依赖特定测验（测验依赖）</b>。"
  ] },
  '测334': { no:'测334', title:"情境：某测验报告\"信度 0.91\"，这个说法缺了什么？", tag:'', pts:[
      "缺三样：<b>①哪种信度（重测／复本／分半／α／评分者）；②施测样本（人数、年龄、能力分布）；③重测的时间间隔（若为重测）</b>。三者缺一，信度数值无法解释，也无法与他测验比较。"
  ] },
  '测335': { no:'测335', title:"效度的定义是什么？为什么说效度是\"相对的\"？", tag:'', pts:[
      "测验<b>能测出所要测的心理特质的程度</b>。相对性在于：<b>效度总是相对于特定用途、特定群体、特定效标而言</b>，没有抽象的\"高效度测验\"。",
      "<u>易错：说\"这个测验很有效\"必须补上\"用于什么目的、对谁\"。</u>"
  ] },
  '测336': { no:'测336', title:"内容效度指什么？用什么方法确定？", tag:'', pts:[
      "题目对<b>所要测量的内容范围的代表性程度</b>。方法是<b>逻辑分析</b>：专家判断 ＋ <b>双向细目表</b>（内容领域 × 认知层次），检查题目是否覆盖各知识点及层次比例。",
      "<u>易错：内容效度不是统计指标，不能说\"用相关法求内容效度\"。</u>"
  ] },
  '测338': { no:'测338', title:"结构效度指什么？为什么它的验证是\"累积过程\"？", tag:'', pts:[
      "指测验<b>是否真的测到了某个理论构念</b>。因为构念是抽象的、无法直接观测，<b>没有单一指标能证明它</b>，只能靠多类证据逐步累积、互相印证或彼此矛盾。"
  ] },
  '测339': { no:'测339', title:"结构效度有哪些证据来源？", tag:'', pts:[
      "<b>①会聚效度与区分效度；②因素分析（探索性与验证性）；③发展变化（随年龄增长而提高）；④实验操作（训练或干预后分数上升）；⑤内部一致性；⑥与其他测验的相关模式；⑦作答过程分析</b>。"
  ] },
  '测340': { no:'测340', title:"会聚效度与区分效度是什么关系？", tag:'', pts:[
      "<b>会聚效度：与理论上应相关的构念测量的相关要高；区分效度：与理论上不应相关的构念测量的相关要低</b>。二者<b>必须同时具备</b>——只高不低说明区分不足（测得过于宽泛），只低不高说明会聚不足（测的不是目标构念）。"
  ] },
  '测341': { no:'测341', title:"效标关联效度指什么？什么叫效度系数？", tag:'', pts:[
      "测验分数与<b>效标</b>（独立于测验的外部标准）的关联程度。二者的<b>相关系数即效度系数</b>。效标必须有独立来源，否则会污染效度。"
  ] },
  '测342': { no:'测342', title:"同时效度与预测效度的区别是什么？", tag:'', pts:[
      "<b>区别只在效标与测验的时间关系</b>：<b>同时效度</b>的效标与测验同时获取（如新量表与已有诊断结果比较）；<b>预测效度</b>的效标在未来获取（如入学测验与一年后成绩）。",
      "<u>易错：区别不在效标类型，而在时间先后。</u>"
  ] },
  '测343': { no:'测343', title:"效标污染与效标缺陷分别指什么？效果方向如何？", tag:'', pts:[
      "<b>效标污染</b>：效标本身包含了测验所测的内容（如用教师评分作为效标，而教师已看过测验分数），会使效度<b>虚高</b>。<b>效标缺陷</b>：效标未能涵盖所测构念的全部方面，会使效度<b>虚低</b>。二者方向相反。"
  ] },
  '测344': { no:'测344', title:"为什么效度的理论上限是 √rxx？", tag:'', pts:[
      "因为<b>测验分数中的误差不可能是有效变异</b>。设 r<sub>xy</sub> 为观测效度，则 r<sub>xy</sub>² ≤ r<sub>xx</sub>（测验分与效标分的相关平方不超过测验自身的信度），故 r<sub>xy</sub> ≤ √r<sub>xx</sub>。",
      "<u>易错：意义是\"提高效度必须先提高信度\"，但信度高并不保证效度高。</u>"
  ] },
  '测346': { no:'测346', title:"效度系数 r＝0.50 意味着预测有多准？", tag:'', pts:[
      "<b>解释率 r²＝0.25，即效标变异的 25% 可由测验解释，其余 75% 来自其他因素与误差</b>。绝不能直接说\"预测准确率 50%\"。",
      "<u>易错：r 与 r² 的混淆是最常见的效度表述错误；判断测验好坏要看 r²。</u>"
  ] },
  '测353': { no:'测353', title:"情境：某智力测验报告\"效度 0.85\"，如何判断这个说法是否可信？", tag:'', pts:[
      "查三处：<b>①哪种效度（内容／结构／效标关联）；②效标是什么、是否独立（有无污染）；③该测验信度是多少（0.85 已逼近 √r<sub>xx</sub> 上限，若信度只有 0.75，则上限仅 0.87，需警惕）</b>。三项不清即无法采信。"
  ] },
  '测354': { no:'测354', title:"难度 P 的公式是什么？P 大表示容易还是难？", tag:'', pts:[
      "<b>P＝答对人数／总人数（通过率）</b>；<b>P 越大表示题目越容易</b>（与\"难度\"字面相反）。",
      "<u>易错：全章最易错处。答题时用\"通过率\"表述最稳，避免\"难度高\"的歧义。</u>"
  ] },
  '测355': { no:'测355', title:"极端分组法测难度时，高低分组各取多少比例？", tag:'', pts:[
      "<b>各取 27%</b>（按总分排序后取高、低两端）。公式 <b>P＝(P<sub>H</sub>＋P<sub>L</sub>)／2</b>。",
      "<u>易错：不是 50%，也不是 33%。取 27% 是因为此时两组差异最稳定。</u>"
  ] },
  '测357': { no:'测357', title:"难度与区分度是什么关系？", tag:'', pts:[
      "<b>P＝0.50 时题目方差最大，区分度 D 达到理论最大</b>；<b>P 接近 0 或 1 时，所有人表现趋同，D 趋近 0</b>。故过易或过难的题区分力都差。"
  ] },
  '测358': { no:'测358', title:"鉴别指数 D 的公式与评价标准？", tag:'', pts:[
      "<b>D＝P<sub>H</sub>−P<sub>L</sub></b>（通过率之<b>差</b>）。标准：<b>≥0.40 很好；0.30–0.39 良好；0.20–0.29 尚可需修改；＜0.19 淘汰</b>。",
      "<u>易错：是之差不是之比。0.80 与 0.40 的 D 是 0.40，不是 2.0。</u>"
  ] },
  '测362': { no:'测362', title:"常模团体的核心要求是什么？", tag:'', pts:[
      "<b>对目标总体的代表性</b>，通过<b>分层随机抽样</b>实现（按年龄、性别、教育、地区等关键变量分层）。<b>常模只对相应团体有效</b>，用于其他群体即为误用。"
  ] },
  '测363': { no:'测363', title:"为什么说\"常模是相对的\"？", tag:'', pts:[
      "因为常模分数只表示<b>个体在特定参照团体中的相对位置</b>，不表示绝对水平。同一原始分在不同常模（如全国常模与农村常模）下可对应完全不同的百分等级。"
  ] },
  '测365': { no:'测365', title:"组内常模主要有哪几类？", tag:'', pts:[
      "<b>百分等级常模与标准分数常模</b>。标准分数包括 <b>z 分数、T 分数、离差智商、标准九</b>。组内常模的核心是\"与同团体他人比较\"。"
  ] },
  '测366': { no:'测366', title:"z、T、离差智商、标准九的均值与标准差各是多少？", tag:'', pts:[
      "<b>z：均值 0、SD 1；T：均值 50、SD 10；离差智商：均值 100、SD 15（韦氏）；标准九：均值 5、SD 2</b>。",
      "<u>易错：斯坦福—比奈的离差智商 SD＝16，与韦氏不同，题目常在此设陷。</u>"
  ] },
  '测368': { no:'测368', title:"常模参照测验与标准参照测验有什么区别？", tag:'', pts:[
      "<b>常模参照：解释个体在团体中的相对位置（看排名），必须有常模</b>；<b>标准参照：对照预先设定的绝对标准判断是否达标（如驾照考试），不需要常模</b>。",
      "<u>易错：标准参照测验不是\"没有效度\"，它的效度靠内容效度与标准设定。</u>"
  ] },
  '测378': { no:'测378', title:"编制心理测验的一般程序是什么？", tag:'', pts:[
      "<b>①确定测验目的与对象；②制定双向细目表；③编制题目；④预测与项目分析；⑤合成测验（选题、组卷、编排）；⑥标准化（施测、评分、常模）；⑦编写测验手册与信效度验证</b>。"
  ] },
  '测379': { no:'测379', title:"双向细目表的作用是什么？", tag:'', pts:[
      "以<b>\"内容领域 × 认知层次\"的二维表格</b>规定各知识点、各层次的题目比例，从而<b>保证内容效度</b>并控制试卷结构。<b>它是编制第一步就要有的核心工具</b>。"
  ] },
  '测380': { no:'测380', title:"测验标准化的三要素是什么？", tag:'', pts:[
      "<b>施测标准化（统一指导语、时限、环境）、评分标准化（明确计分规则、减少主观性）、常模（代表性样本的分数分布）</b>，另需信度与效度证据。",
      "<u>易错：只建立常模不算标准化测验，三者缺一不可。</u>"
  ] },
  '测382': { no:'测382', title:"第一个正式智力量表是什么？由谁编制？", tag:'', pts:[
      "<b>比奈—西蒙量表（1905 年，法国）</b>，比奈与西蒙编制，用于鉴别需要特殊教育的儿童。它是<b>第一个科学的智力测验</b>。"
  ] },
  '测383': { no:'测383', title:"比率智商的公式是什么？为什么被淘汰？", tag:'', pts:[
      "<b>IQ＝(智龄 MA／实龄 CA)×100</b>。淘汰原因：<b>智龄增长会停止（约 15–16 岁后），而实龄持续增长，导致成人智商逐年下降</b>；且各年龄段的单位不等距。"
  ] },
  '测384': { no:'测384', title:"离差智商的含义是什么？为什么取代了比率智商？", tag:'', pts:[
      "<b>IQ＝100＋15z（韦氏）</b>，表示个体在同龄群体中的相对位置。<b>取代原因</b>：<b>它不依赖智龄，可用于任何年龄；各年龄段分布恒定（均值 100、SD 15），单位等距</b>。"
  ] },
  '测387': { no:'测387', title:"MMPI 的结构是什么？", tag:'', pts:[
      "<b>明尼苏达多相人格调查表：4 个效度量表（L、F、K、？）＋10 个临床量表</b>（如疑病、抑郁、癔病、精神病态、偏执、精神衰弱、精神分裂、轻躁狂、社会内向等）。用于<b>精神科辅助诊断</b>。",
      "<u>易错：L、F、K、？是效度量表，不是临床量表——最高频对应错误。</u>"
  ] },
  '测389': { no:'测389', title:"EPQ 包含哪几个维度？L 量表是什么？", tag:'', pts:[
      "<b>E（内外向）、N（神经质）、P（精神质）</b>三个人格维度，外加 <b>L（掩饰／说谎）效度量表</b>。",
      "<u>易错：L 不属于人格维度，是效度量表；P 分高表示孤僻、冷漠、不近人情，不等于\"精神病\"。</u>"
  ] },
  '测390': { no:'测390', title:"罗夏墨迹测验与 TAT 分别是什么？", tag:'', pts:[
      "<b>罗夏：10 张墨迹图（5 黑白、2 黑白红、3 彩色），让被试说出看到什么</b>；<b>TAT（主题统觉测验，默里）：约 30 张意义模糊的图片，让被试编故事</b>。二者都是<b>投射测验</b>。"
  ] },
  '测391': { no:'测391', title:"投射测验的共同特点与优缺点是什么？", tag:'', pts:[
      "特点：<b>刺激意义模糊、反应自由、可绕过防御</b>。优点：<b>能探索无意识内容、减少表面效度带来的作假</b>。缺点：<b>信效度普遍低于自陈量表、评分与解释依赖主试经验、耗时长</b>。",
      "<u>易错：不能说\"投射测验更深入所以更好\"。</u>"
  ] },
  '统T23': { no:'统T23', title:"平均数、中数、众数各适用什么情况？", tag:'', pts:[
      "<b>平均数</b>：等距或比例数据，利用全部信息、最稳定，但<b>受极端值影响大</b>。<b>中数</b>：顺序数据、有极端值或开口资料，<b>稳健</b>但只用位置信息。<b>众数</b>：命名数据，可多个，<b>不稳定、受分组方式影响</b>。",
      "<u>易错：不能一律\"用平均数\"，要看数据类型与分布形态。</u>"
  ] },
  '统T24': { no:'统T24', title:"正偏与负偏时，平均数、中数、众数的大小关系是什么？原因？", tag:'', pts:[
      "<b>正偏（右偏、长尾在右）：M＞Md＞Mo</b>；<b>负偏（左偏、长尾在左）：M＜Md＜Mo</b>。原因：平均数被极端值拉向长尾一侧，中数只由位置决定，众数落在人数最多的峰顶。",
      "<u>易错：方向看长尾不看峰。\"M＞Md＞Mo\"直接对应正偏。</u>"
  ] },
  '统T25': { no:'统T25', title:"为什么样本方差要除以 n−1 而不是 n？", tag:'', pts:[
      "因为用样本均值 M 代替总体均值 μ 后，<b>Σ(X−M)² 系统性偏小</b>，除以 n 会低估总体方差。<b>除以 n−1（自由度）才是无偏估计</b>；样本越小偏差越明显。",
      "<u>易错：σ²＝SS/N 是总体方差，s²＝SS/(n−1) 是样本方差，不可混用。</u>"
  ] },
  '统T28': { no:'统T28', title:"z 分数有哪些性质？", tag:'', pts:[
      "<b>z＝(X−M)／SD；均值恒为 0、标准差恒为 1</b>；可正可负，表示距均值几个标准差；属等距量表。<b>线性变换不改变分布形状</b>。",
      "<u>易错：标准化只改变均值与标准差，不改变偏度与峰度；z 分数不等于\"正态化\"。</u>"
  ] },
  '统T30': { no:'统T30', title:"百分等级（PR）与百分位数有什么区别？", tag:'', pts:[
      "<b>百分等级是\"名次\"</b>：低于某分数者占总人数的百分比；<b>百分位数是\"分数\"</b>：对应某累计百分比的原始分数。二者<b>互为反函数</b>。",
      "<u>易错：问\"排名第几\"是 PR，问\"分数是多少\"是百分位数。</u>"
  ] },
  '统T31': { no:'统T31', title:"积差相关（皮尔逊）的适用条件？", tag:'', pts:[
      "<b>两变量均为等距或比例数据；呈线性关系；成对数据且样本较大（一般 n≥30）</b>。公式 <b>r＝Sxy／√(Sxx·Syy)</b>，|r|≤1。",
      "<u>易错：等级数据不能用；r 只测线性关系，强曲线关系时 r 可能接近 0。</u>"
  ] },
  '统T34': { no:'统T34', title:"相关系数 r 的正确解读是哪三条？", tag:'', pts:[
      "<b>① r 只表示线性关系的强度与方向，|r|≤1；② r² 才是解释率（y 的变异中被 x 解释的比例）；③ 相关不等于因果</b>，可能是第三变量或反向因果，要确立因果须做实验。",
      "<u>易错：r＝0 不代表\"无关\"，只代表\"无线性关系\"；r 高也不代表预测准。</u>"
  ] },
  '统T35': { no:'统T35', title:"什么是标准误？公式是什么？", tag:'', pts:[
      "<b>样本统计量（通常是均值）的抽样分布的标准差</b>，反映\"样本均值有多不稳定\"。均值标准误 <b>SE＝σ／√n</b>，σ 未知时用 s 代替。",
      "<u>易错：SE 不是某个样本的标准差，而是多次抽样所得均值的离散程度。</u>"
  ] },
  '统T36': { no:'统T36', title:"标准误与标准差有什么区别？", tag:'', pts:[
      "<b>标准差 s 描述\"个体之间的分散\"</b>，随样本本身波动；<b>标准误 SE 描述\"样本均值的抽样波动\"</b>，<b>随 n 增大而减小</b>。关系：<b>SE＝s／√n</b>。",
      "<u>易错：最高频的概念混淆——看到\"均值的不确定性\"就是 SE。</u>"
  ] },
  '统T37': { no:'统T37', title:"中心极限定理的内容与意义？", tag:'', pts:[
      "从任意分布的总体中抽取容量 n 的样本，<b>当 n 足够大（经验值 n≥30）时，样本均值的抽样分布近似正态</b>，其<b>均值＝μ、标准差＝σ／√n</b>。这是 z、t、F 检验成立的根本依据。",
      "<u>易错：它说的是\"均值的分布\"趋于正态，不是原始数据变正态。</u>"
  ] },
  '统T38': { no:'统T38', title:"总体分布、样本分布、抽样分布三者有什么区别？", tag:'', pts:[
      "<b>总体分布</b>：总体中所有个体的分数分布；<b>样本分布</b>：一次抽样所得 n 个分数的分布；<b>抽样分布</b>：反复抽样所得<b>统计量</b>（如均值）的分布。推断统计研究的是第三种。",
      "<u>易错：只有抽样分布的标准差才叫标准误；样本分布的标准差是 s。</u>"
  ] },
  '统T43': { no:'统T43', title:"为什么 σ 未知时要用 t 分布而不是 z 分布？", tag:'', pts:[
      "因为用 <b>s 估计 σ 会引入额外不确定性</b>，使统计量分布尾部变厚、极端值更易出现。<b>t 分布把这种\"估计误差\"计入临界值</b>，故 σ 未知时必须用 t。",
      "<u>易错：判断依据是\"σ 是否已知\"，不是\"n 是否大于 30\"。</u>"
  ] },
  '统T48': { no:'统T48', title:"为什么说抽样分布是统计推断的基础？", tag:'', pts:[
      "因为推断的对象是<b>\"样本统计量相对于总体参数会如何波动\"</b>。有了抽样分布才能算某个样本结果出现的概率，进而做区间估计与假设检验——<b>z＝(M−μ)／SE 正是把样本结果放到抽样分布上定位</b>。",
      "<u>易错：推断不是\"用样本代替总体\"，而是\"用抽样分布的规律反推总体\"。</u>"
  ] },
  '统T49': { no:'统T49', title:"点估计的三个评价标准是什么？", tag:'', pts:[
      "<b>无偏性</b>（估计量的期望等于真值，故样本方差除 n−1）·<b>有效性</b>（无偏前提下方差越小越有效）·<b>一致性</b>（n→∞ 时趋近真值）。",
      "<u>易错：有效性的比较必须在无偏的前提内进行。</u>"
  ] },
  '统T50': { no:'统T50', title:"\"95% 置信区间\"的正确解释是什么？", tag:'', pts:[
      "<b>反复抽样所构造的许多 95% 置信区间中，约有 95% 会包含总体参数</b>。",
      "<u>易错：不能说\"总体参数有 95% 概率落在这个区间内\"——参数固定，随机的是区间。</u>"
  ] },
  '统T51': { no:'统T51', title:"假设检验的五个步骤是什么？", tag:'', pts:[
      "<b>①提出 H₀ 与 H₁；②选定检验统计量与显著性水平 α；③确定临界值与拒绝域；④计算统计量实际值；⑤与临界值比较，作出\"拒绝／不拒绝 H₀\"的结论</b>。",
      "<u>易错：漏写\"临界值\"那一步最常扣分；结论要连着统计量写，如 t(18)=2.50, p＜.05。</u>"
  ] },
  '统T52': { no:'统T52', title:"为什么不能说\"接受 H₀\"？", tag:'', pts:[
      "检验的逻辑是<b>反证法</b>：只能<b>\"拒绝 H₀\"或\"不拒绝 H₀\"</b>。不拒绝只说明\"证据不足\"，不等于\"证明 H₀ 为真\"。",
      "<u>易错：规范表述是\"无充分证据表明……\"或\"不拒绝 H₀\"。</u>"
  ] },
  '统T53': { no:'统T53', title:"第一类错误与第二类错误分别是什么？", tag:'', pts:[
      "<b>α（弃真）：H₀ 为真却拒绝</b>；<b>β（取伪）：H₀ 为假却保留</b>。",
      "<u>易错：α 对应\"冤枉好人\"，β 对应\"放过坏人\"；α 事先设定，β 由效应量、n、α 共同决定。</u>"
  ] },
  '统T54': { no:'统T54', title:"α 与 β 是什么关系？能同时减小吗？", tag:'', pts:[
      "<b>n 固定时，α 减小则 β 增大，二者此消彼长</b>。<b>要同时减小 α 与 β，只能增大样本量或增大效应量（减小误差变异）</b>。",
      "<u>易错：简答必须写出\"n 固定\"这一前提，不能只答\"不能同时减小\"。</u>"
  ] },
  '统T55': { no:'统T55', title:"什么是统计效力？受哪些因素影响？", tag:'', pts:[
      "<b>效力＝1−β</b>，即 H₀ 为假时能正确检出的概率，常规要求 <b>≥0.80</b>。影响因素：<b>效应量↑、样本量↑、α↑、单侧检验、误差变异↓ → 效力↑</b>。",
      "<u>易错：效力高只说明\"更可能发现真实效应\"，不代表结论必然正确。</u>"
  ] },
  '统T56': { no:'统T56', title:"什么时候用单侧检验、什么时候用双侧？", tag:'', pts:[
      "<b>有明确方向性预期时用单侧；只关心\"是否有差异\"而无方向时用双侧</b>。必须依据理论与假设<b>事先决定</b>。",
      "<u>易错：单侧临界值更小（1.645 vs 1.96），看完数据再改单侧＝人为放大 I 类错误。</u>"
  ] },
  '统T57': { no:'统T57', title:"p 值的准确含义是什么？", tag:'', pts:[
      "<b>在 H₀ 为真的前提下，得到当前观测结果或更极端结果的概率</b>。p＜α 时拒绝 H₀。",
      "<u>易错：p 不是\"H₀ 为真的概率\"，也不是\"结论错误的概率\"，更不是效应大小。</u>"
  ] },
  '统T58': { no:'统T58', title:"为什么 p＜.05 不等于\"效应大、结论重要\"？", tag:'', pts:[
      "因为 <b>p 同时受效应量与样本量影响</b>：样本很大时微小差异也能显著，样本很小时大效应也可能不显著。<b>故必须同时报告效应量（d、η²、r²）</b>。",
      "<u>易错：显著＝\"不太可能是偶然\"，重要＝\"效应足够大\"，是两个问题。</u>"
  ] },
  '统T60': { no:'统T60', title:"置信区间与假设检验是什么关系？", tag:'', pts:[
      "<b>双尾 α＝.05 时，95% 置信区间不包含 H₀ 指定值 ⇔ 拒绝 H₀</b>。两者信息等价，但<b>置信区间还给出效应大小的范围</b>，信息更丰富。",
      "<u>易错：小样本用 t 临界值时，CI 也要用 t 而非 1.96，否则与检验结论不一致。</u>"
  ] },
  '统T66': { no:'统T66', title:"为什么多次两两比较会抬高 I 类错误率？怎么处理？", tag:'', pts:[
      "k 组两两比较共 <b>k(k−1)／2 次</b>，每次都用 α＝.05 时<b>族系错误率迅速膨胀</b>（4 组 6 次约 1−0.95⁶≈26%）。处理：<b>先用总体 F 检验控制 α，再用校正过的事后检验（N-K、Tukey HSD）</b>。",
      "<u>易错：这不是\"多做几次更可靠\"，而是错误率累积问题。</u>"
  ] },
  '统T67': { no:'统T67', title:"单样本 t、独立样本 t、配对样本 t 各在什么情况下使用？", tag:'', pts:[
      "<b>单样本 t</b>：一个样本均值与已知总体均值比较；<b>独立样本 t</b>：两组互不相关的被试比较；<b>配对样本 t</b>：同一批被试的两次测量（或配对组）比较。",
      "<u>易错：同一批被试前后测必须用配对 t，用独立样本 t 会浪费效力并算错 df。</u>"
  ] },
  '统T68': { no:'统T68', title:"独立样本 t 检验的自由度是多少？为什么？", tag:'', pts:[
      "<b>df＝n₁＋n₂−2</b>。因为两组各自用样本均值估计后各损失一个自由度（<b>估计了两个均值</b>），故 (n₁−1)＋(n₂−1)。",
      "<u>易错：写成 n₁＋n₂−1 或 n−1 是高频错误；方差不齐用 Welch 校正时 df 会变小数。</u>"
  ] },
  '统T69': { no:'统T69', title:"配对样本 t 检验的自由度是多少？", tag:'', pts:[
      "<b>df＝对数−1</b>（8 对则 df＝7）。因为配对 t 本质是<b>对差值 D 做单样本 t 检验</b>，只有一组差值。",
      "<u>易错：不能按\"总人数−2\"算；个体差异已被消掉。</u>"
  ] },
  '统T70': { no:'统T70', title:"独立样本 t 中的合并方差是什么？怎么算？", tag:'', pts:[
      "<b>s<sub>p</sub>²＝(SS₁＋SS₂)／(df₁＋df₂)</b>，即两组方差的<b>加权平均</b>（大样本组权重大）。再算 <b>SE<sub>diff</sub>＝√[s<sub>p</sub>²(1/n₁＋1/n₂)]</b>。",
      "<u>易错：不是把两个标准差直接平均；合并的前提是方差齐性。</u>"
  ] },
  '统T71': { no:'统T71', title:"独立样本 t 检验的三个前提是什么？", tag:'', pts:[
      "<b>①独立性（两组被试互不相关）②正态性（各总体服从正态分布）③方差齐性（两总体方差相等）</b>。",
      "<u>易错：配对／重复测量设计不要求\"独立\"（数据本身相关），但要求差值的正态性。</u>"
  ] },
  '统T73': { no:'统T73', title:"t 检验与方差分析是什么关系？", tag:'', pts:[
      "<b>两组比较时二者等价：t²＝F</b>。独立样本 t 的平方＝单因素完全随机 ANOVA 的 F；<b>配对 t 的平方＝单因素重复测量 ANOVA 的 F</b>。t 检验是 F 检验在两水平时的特例。",
      "<u>易错：关系是\"平方\"不是\"相等\"；t 可为负，F 恒为正。</u>"
  ] },
  '统T74': { no:'统T74', title:"为什么 t 值大不代表效应大？", tag:'', pts:[
      "因为 <b>t＝(M₁−M₂)／SE<sub>diff</sub>，而 SE 随样本量增大而减小</b>。样本足够大时很小的均值差也能得到大 t 值。<b>d＝(M₁−M₂)／s<sub>p</sub> 不随 n 变化</b>，才是效应大小指标。",
      "<u>易错：报告须同时给 t、df、p、d（或 CI），只给 t 无法判断实际意义。</u>"
  ] },
  '统T76': { no:'统T76', title:"配对（重复测量）设计在统计上的主要优点是什么？", tag:'', pts:[
      "<b>个体差异被从误差项中剔除</b>，误差变小 → <b>统计效力更高、所需样本更少</b>；同时控制了与个体有关的额外变量。",
      "<u>易错：代价是引入顺序与练习效应，必须用 ABBA／拉丁方平衡。</u>"
  ] },
  '统T77': { no:'统T77', title:"同一批被试前后测若错用独立样本 t，会有什么后果？", tag:'', pts:[
      "<b>把本可剔除的个体差异算进误差，SE 被夸大 → t 值偏小、效力下降</b>；且 <b>df 也算错</b>（应为对数−1）。可能把真实存在的效应判为不显著。",
      "<u>易错：这是\"统计方法与设计不匹配\"的典型扣分点。</u>"
  ] },
  '统T81': { no:'统T81', title:"回归系数 b 的含义是什么？", tag:'', pts:[
      "<b>x 每增加 1 个单位，y 平均变化 b 个单位</b>。公式 <b>b＝Sxy／Sxx</b>，<b>b 带单位</b>（y 的单位／x 的单位）。",
      "<u>易错：b 不能跨变量直接比大小；要比较相对作用须用标准化回归系数。</u>"
  ] },
  '统T82': { no:'统T82', title:"r 与 b 是什么关系？", tag:'', pts:[
      "<b>b＝r·(S<sub>y</sub>／S<sub>x</sub>)</b>。r 是<b>无单位的标准化斜率</b>，b 是<b>有单位的原始斜率</b>；|r|≤1，b 可大于 1 或为负。",
      "<u>易错：二者符号相同，但大小不能互相替代；相关对称、回归不对称。</u>"
  ] },
  '统T83': { no:'统T83', title:"决定系数 r² 的含义是什么？", tag:'', pts:[
      "<b>y 的变异中被 x 解释的比例</b>（r²＝SS<sub>回归</sub>／SS<sub>总</sub>）。如 r＝0.50 时 r²＝0.25，即解释 25%。",
      "<u>易错：不能说\"x 决定 y 的 25%\"，只能说\"解释／预测\"；r² 高也不代表因果成立。</u>"
  ] },

var S = {

  palace:null,
  room:null,

  queue:[],
  i:0,
  revealed:false,
  session:{},
  store: loadStore(),
  theme: loadTheme(),
  flash:''
};

/* ================= 存档 ================= */
function loadStore(){
  var out = {};
  try{
    var raw = localStorage.getItem(APP.key);
    if(!raw) return out;
    var d = JSON.parse(raw);
    if(!d || typeof d !== 'object' || Array.isArray(d)) return out;
    Object.keys(d).forEach(function(k){
      if(!ITEMS[k]) return;
      var v = d[k];
      if(!v || typeof v !== 'object') return;
      if(!Number.isInteger(v.r) || v.r < 0 || v.r > 2) return;
      if(!Number.isInteger(v.n) || v.n < 0 || v.n > 9999) return;
      out[k] = { r:v.r, n:v.n, c:(typeof v.c === 'string' ? v.c.slice(0, 60) : '') };
    });
  }catch(e){}
  return out;
}
function saveStore(){
  try{ localStorage.setItem(APP.key, JSON.stringify(S.store)); }catch(e){}
}
function loadTheme(){
  try{
    var id = localStorage.getItem(APP.themeKey);
    for(var i = 0; i < THEMES.length; i++){ if(THEMES[i].id === id) return THEMES[i]; }
  }catch(e){}
  return THEMES[0];
}
function applyTheme(){
  var t = S.theme, el = document.documentElement.style;
  el.setProperty('--paper', t.paper);
  el.setProperty('--deep', t.deep);
  el.setProperty('--deep-soft', t.soft);
  try{ localStorage.setItem(APP.themeKey, t.id); }catch(e){}
}

/* ================= 备份 ================= */
function exportBackup(){
  try{
    var d = new Date();
    var stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    var name = '记忆宫殿-备份-' + stamp + '.json';
    var payload = { app:'palace.frame', v:1, theme:S.theme.id, data:S.store };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    S.flash = '已导出 ' + name;
  }catch(e){
    S.flash = '导出失败：' + e.message;
  }
  render();
}
function exportText(){
  try{
    var d = new Date();
    var stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    var lines = [];
    lines.push('记忆宫殿 · 画面清单');
    lines.push('导出时间：' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'));
    lines.push('');
    PALACES.forEach(function(p){
      lines.push('■ ' + p.name + '（' + p.rooms.length + ' 间房）');
      p.rooms.forEach(function(r){
        r.spots.forEach(function(sp){
          sp.ids.forEach(function(id){
            var it = ITEMS[id], rec = S.store[id];
            var rate = !rec ? '未评' : (rec.n === 0 ? '已摆未考' : ['忘了','模糊','记住了'][rec.r]);
            lines.push(r.name + ' · ' + sp.s + ' ｜ ' + it.no + ' ' + it.title + ' ｜ ' + rate);
            if(rec && rec.c) lines.push('    画面：' + rec.c);
          });
        });
      });
      lines.push('');
    });
    var name = '记忆宫殿-画面清单-' + stamp + '.txt';
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    S.flash = '已导出 ' + name;
  }catch(e){
    S.flash = '导出失败：' + e.message;
  }
  render();
}
function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var d = JSON.parse(String(reader.result));
      var data = (d && d.data) ? d.data : d;
      if(!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('不是备份文件');
      var ok = 0, skip = 0;
      Object.keys(data).forEach(function(k){
        if(!ITEMS[k]){ skip++; return; }
        var v = data[k];
        if(!v || typeof v !== 'object' || !Number.isInteger(v.r) || v.r < 0 || v.r > 2){ skip++; return; }
        S.store[k] = {
          r: v.r,
          n: Number.isInteger(v.n) ? v.n : 0,
          c: typeof v.c === 'string' ? v.c.slice(0, 60) : ''
        };
        ok++;
      });
      saveStore();
      if(d && typeof d.theme === 'string'){
        THEMES.forEach(function(t){ if(t.id === d.theme) S.theme = t; });
      }
      S.flash = '导入完成：' + ok + ' 条' + (skip ? '，跳过 ' + skip + ' 条' : '');
    }catch(e){
      S.flash = '导入失败：' + e.message;
    }
    S.view = 'home';
    render();
  };
  reader.onerror = function(){ S.flash = '读取文件失败'; render(); };
  reader.readAsText(file);
}

/* ================= 工具 ================= */
function shuffle(a){
  var arr = a.slice();
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function sub(t){ document.getElementById('sub').textContent = t; }
function roomColor(palace, room){
  var i = palace.rooms.indexOf(room);
  if(i < 0) i = 0;
  return S.theme.rooms[i % S.theme.rooms.length];
}
function itemMastered(ids){
  return ids.every(function(id){ return S.store[id] && S.store[id].r === 2; });
}
function palaceStats(palace){
  var total = 0, done = 0;
  palace.rooms.forEach(function(r){
    r.spots.forEach(function(sp){
      total++;
      if(itemMastered(sp.ids)) done++;
    });
  });
  return { total: total, done: done };
}
function allStats(){
  var total = 0, done = 0;
  PALACES.forEach(function(p){
    var s = palaceStats(p);
    total += s.total;
    done += s.done;
  });
  return { total: total, done: done };
}
function firstNote(ids){
  for(var i = 0; i < ids.length; i++){
    var rec = S.store[ids[i]];
    if(rec && rec.c) return rec.c;
  }
  return '';
}

/* ================= 会话 ================= */
function startRoom(palace, room, mode){
  S.palace = palace;
  S.room = room;
  S.mode = mode;
  S.session = {};
  S.i = 0;
  S.revealed = false;
  S.queue = room.spots.map(function(sp){
    return { room: room, spot: sp.s, ids: sp.ids };
  });
  S.view = 'card';
  render();
}
function startAll(palace){
  S.palace = palace;
  S.room = null;
  S.mode = 'recall';
  S.session = {};
  S.i = 0;
  S.revealed = false;
  S.queue = [];
  palace.rooms.forEach(function(r){
    r.spots.forEach(function(sp){
      S.queue.push({ room: r, spot: sp.s, ids: sp.ids });
    });
  });
  S.queue = shuffle(S.queue);
  S.view = 'card';
  render();
}
function advanceEncode(){
  var cur = S.queue[S.i];
  if(cur){
    var input = document.getElementById('note');
    var note = input ? input.value.trim().slice(0, 60) : '';
    cur.ids.forEach(function(id){
      var rec = S.store[id] || { r:0, n:0, c:'' };
      if(note) rec.c = note;
      S.store[id] = rec;
    });
    saveStore();
  }
  S.i++;
  if(S.i >= S.queue.length) S.view = 'done';
  render();
}
function rate(r){
  var cur = S.queue[S.i];
  if(!cur) return;
  cur.ids.forEach(function(id){
    var rec = S.store[id] || { r:0, n:0, c:'' };
    rec.r = r;
    rec.n = (rec.n || 0) + 1;
    S.store[id] = rec;
    S.session[id] = r;
  });
  saveStore();
  S.revealed = false;
  S.i++;
  if(S.i >= S.queue.length) S.view = 'result';
  render();
}

function enterFromHash(){
  var h = String(location.hash || '').replace('#', '');
  if(!h) return;
  for(var i = 0; i < PALACES.length; i++){
    if(PALACES[i].id === h){ S.palace = PALACES[i]; S.view = 'palace'; return; }
  }
}

function weakQueue(){

  S.queue.forEach(function(q){
    if(q.ids.some(function(id){ return S.session[id] === 0 || S.session[id] === 1; })) out.push(q);
  });
  return out;
}

function viewResult(){
  var c = [0,0,0];
  var ids = [];
  S.queue.forEach(function(q){ ids = ids.concat(q.ids); });
  ids.forEach(function(id){
    var r = S.session[id];
    if(r === 0 || r === 1 || r === 2) c[r]++;
  });
  var total = ids.length;
  var weak = weakQueue();

  var mainBtn = weak.length
    ? '<button class="btn primary" data-act="weak">只复习没记住的（' + weak.length + ' 处）</button>' +
      '<button class="btn ghost" data-act="again">整间再走一遍</button>'
    : '<button class="btn primary" data-act="again">再走一遍</button>';

  return '<div class="score">' +
           '<div class="score-num">' + c[2] + '<span style="font-size:18px;color:#A9A194"> / ' + total + ' 条</span></div>' +
           '<div class="score-label">' + (S.room ? esc(S.room.name) : esc(S.palace.name)) + ' 走完了</div>' +
         '</div>' +
         '<div class="breakdown">' +
           '<div class="b2"><div class="n">' + c[2] + '</div><div class="l">记住了</div></div>' +
           '<div class="b1"><div class="n">' + c[1] + '</div><div class="l">模糊</div></div>' +
           '<div class="b0"><div class="n">' + c[0] + '</div><div class="l">忘了</div></div>' +
         '</div>' +
         mainBtn +
         '<button class="btn ghost" data-act="palace">回房间列表</button>' +
         '<button class="btn ghost" data-act="home">全部地点</button>';
}

function render(){
  var app = document.getElementById('app');
  applyTheme();
  document.getElementById('appName').textContent = APP.title;
  if(S.view === 'home'){ app.innerHTML = viewHome(); sub(APP.sub); }
  else if(S.view === 'palace'){ app.innerHTML = viewPalace(); sub(esc(S.palace.name)); }
  else if(S.view === 'card'){ app.innerHTML = viewCard(); sub(S.mode === 'encode' ? '摆放模式' : '走宫回忆'); }
  else if(S.view === 'done'){ app.innerHTML = viewDone(); sub('准备回忆'); }
  else { app.innerHTML = viewResult(); sub('本间小结'); }
  window.scrollTo(0, 0);
}

/* ================= 事件 ================= */
var app = document.getElementById('app');

app.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act === 'palace'){
    if(el.hasAttribute('data-id')){
      var pid = el.getAttribute('data-id');
      PALACES.forEach(function(p){ if(p.id === pid) S.palace = p; });
    }
    if(!S.palace) return;
    S.view = 'palace';
    render();
  }
  else if(act === 'room'){
    var rid = el.getAttribute('data-id');
    var room = null;
    S.palace.rooms.forEach(function(r){ if(r.id === rid) room = r; });
    if(!room) return;
    var encoded = room.spots.every(function(sp){
      return sp.ids.some(function(x){ return !!S.store[x]; });
    });
    startRoom(S.palace, room, encoded ? 'recall' : 'encode');
  }
  else if(act === 'all') startAll(S.palace);
  else if(act === 'advance') advanceEncode();
  else if(act === 'reveal'){ S.revealed = true; render(); }
  else if(act === 'rate') rate(Number(el.getAttribute('data-r')));
  else if(act === 'test') startRoom(S.palace, S.room, 'recall');
  else if(act === 'reencode'){ if(S.room) startRoom(S.palace, S.room, 'encode'); }
  else if(act === 'again'){
    if(S.room) startRoom(S.palace, S.room, 'recall');
    else startAll(S.palace);
  }
  else if(act === 'weak'){
    var weak = weakQueue();
    if(!weak.length) return;
    S.queue = weak;
    S.i = 0;
    S.session = {};
    S.revealed = false;
    S.mode = 'recall';
    S.view = 'card';
    render();
  }
  else if(act === 'theme'){
    var tid = el.getAttribute('data-id');
    THEMES.forEach(function(t){ if(t.id === tid) S.theme = t; });
    applyTheme();
    render();
  }
  else if(act === 'export') exportBackup();
  else if(act === 'text') exportText();
  else if(act === 'hint'){
    var cur = S.queue[S.i];
    if(cur){
      el.textContent = cur.ids.map(function(id){ return ITEMS[id].no; }).join(' / ');
      el.style.borderStyle = 'solid';
    }
  }
  else if(act === 'home'){ S.view = 'home'; S.room = null; render(); }
});

app.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target && e.target.id === 'note'){
    e.preventDefault();
    advanceEncode();
  }
});

app.addEventListener('change', function(e){
  if(e.target && e.target.id === 'importFile' && e.target.files && e.target.files[0]){
    importBackup(e.target.files[0]);
  }
});

applyTheme();
enterFromHash();
render();
})();
</script>

      navigator.serviceWorker.register('../sw.js').catch(function () {});
    });
  }
</script>
